<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .panel {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 26px;
            box-shadow: 0 14px 34px rgba(33, 45, 70, 0.07);
        }
        h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
        .intro { color: #66758a; line-height: 1.55; margin: 0 0 22px; }
        label { display: block; font-weight: 800; margin-bottom: 8px; }
        .slots { display: grid; gap: 10px; margin-bottom: 18px; }
        .slot {
            border: 1px solid #cfd8e5;
            background: #fff;
            color: #172033;
            border-radius: 8px;
            min-height: 44px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
        }
        .slot.selected {
            border-color: #2563eb;
            background: #e8f0ff;
            color: #174ebd;
        }
        input {
            width: 100%;
            border: 1px solid #cfd8e5;
            border-radius: 8px;
            padding: 12px;
            font: inherit;
            margin-bottom: 16px;
        }
        input:focus {
            outline: 3px solid #dbe8ff;
            border-color: #2563eb;
        }
        .submit {
            width: 100%;
            border: 0;
            border-radius: 8px;
            min-height: 48px;
            background: #087443;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
        }
        .submit:disabled { background: #7d8da3; cursor: wait; }
        .loader { color: #66758a; text-align: center; padding: 22px; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Book Appointment</h1>
        <p class="intro">Choose a time after the team has reviewed your request and sent this booking link.</p>

        <div id="loader" class="loader">Loading available times...</div>

        <section id="booking-form" style="display: none;">
            <label>Available Times</label>
            <div class="slots" id="slots"></div>

            <label for="address">Confirm Address</label>
            <input type="text" id="address" placeholder="Street address, city" required>

            <button class="submit" id="submit-btn" onclick="submitBooking()" disabled>Confirm Booking</button>
        </section>
    </main>

    <script>
        let selectedSlotId = null;
        const token = new URLSearchParams(window.location.search).get("token");

        document.addEventListener("DOMContentLoaded", () => {
            if (!token) {
                showError("Invalid or missing booking link.");
                return;
            }
            document.getElementById("address").addEventListener("input", validateForm);
            fetchSlots();
        });

        async function fetchSlots() {
            try {
                const response = await fetch("/api/appointments/slots");
                const slots = await response.json();
                document.getElementById("loader").style.display = "none";
                document.getElementById("booking-form").style.display = "block";
                renderSlots(slots);
            } catch (error) {
                showError("Error loading availability. Please try again later.");
            }
        }

        function renderSlots(slots) {
            const container = document.getElementById("slots");
            if (!slots.length) {
                container.innerHTML = '<div class="loader">No times currently available.</div>';
                return;
            }

            container.innerHTML = "";
            slots.forEach(slot => {
                const dateObj = new Date(slot.slot_datetime);
                const dateStr = dateObj.toLocaleDateString(undefined, {
                    weekday: "short",
                    month: "short",
                    day: "numeric"
                });
                const timeStr = dateObj.toLocaleTimeString(undefined, {
                    hour: "numeric",
                    minute: "2-digit"
                });
                const button = document.createElement("button");
                button.type = "button";
                button.className = "slot";
                button.textContent = `${dateStr} at ${timeStr}`;
                button.onclick = () => {
                    document.querySelectorAll(".slot").forEach(item => item.classList.remove("selected"));
                    button.classList.add("selected");
                    selectedSlotId = slot.id;
                    validateForm();
                };
                container.appendChild(button);
            });
        }

        function validateForm() {
            const address = document.getElementById("address").value.trim();
            document.getElementById("submit-btn").disabled = !(selectedSlotId && address.length > 5);
        }

        async function submitBooking() {
            const submitBtn = document.getElementById("submit-btn");
            const address = document.getElementById("address").value.trim();
            submitBtn.disabled = true;
            submitBtn.textContent = "Booking...";

            try {
                const response = await fetch("/api/appointments/book", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token,
                        slot_id: selectedSlotId,
                        confirmed_address: address
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = `/static/booking-confirmed.html?token=${token}`;
                    return;
                }
                alert(data.detail || "Failed to book appointment.");
            } catch (error) {
                alert("Network error. Please try again.");
            }

            submitBtn.disabled = false;
            submitBtn.textContent = "Confirm Booking";
        }

        function showError(message) {
            document.getElementById("loader").textContent = message;
        }
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
