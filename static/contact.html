<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .panel {
            width: 100%;
            max-width: 620px;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 14px 34px rgba(33, 45, 70, 0.07);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 32px;
            letter-spacing: 0;
        }
        p {
            color: #66758a;
            line-height: 1.6;
            margin: 0 0 22px;
        }
        .contact-list {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }
        .contact-row {
            padding: 14px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: #f8fafc;
        }
        .contact-row strong {
            display: block;
            margin-bottom: 4px;
        }
        a {
            color: #174ebd;
            font-weight: 800;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Contact For Service</h1>
        <p>If you want this lead automation service for your business, send me your contact details. Please include your WhatsApp number or the email address where I can reach you.</p>

        <section class="contact-list">
            <div class="contact-row">
                <strong>Twitter</strong>
                <a href="https://twitter.com/khushal1504" target="_blank" rel="noopener">DM me on Twitter: @khushal1504</a>
            </div>
            <div class="contact-row">
                <strong>Email</strong>
                <a href="mailto:khushalboy15@gmail.com?subject=Lead%20Automation%20Service%20Inquiry&body=Hi%20Khushal%2C%0A%0AI%20am%20interested%20in%20the%20lead%20automation%20service.%20Here%20are%20my%20contact%20details%3A%0AWhatsApp%3A%20%0AEmail%3A%20%0A">khushalboy15@gmail.com</a>
            </div>
        </section>

        <a class="button" href="/">Back to Demo</a>
    </main>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
