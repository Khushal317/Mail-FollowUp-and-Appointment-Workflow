<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Started</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .panel {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 34px;
            text-align: center;
            box-shadow: 0 14px 34px rgba(33, 45, 70, 0.07);
        }
        .mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e7f8ef;
            color: #087443;
            font-weight: 900;
            font-size: 16px;
        }
        h1 { margin: 0 0 10px; font-size: 32px; letter-spacing: 0; }
        p { color: #66758a; line-height: 1.6; margin: 0 0 24px; }
        .actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 800;
            text-decoration: none;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .actions .secondary {
            background: #eef4ff;
            color: #174ebd;
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="mark">OK</div>
        <h1>Thanks! The automation has started.</h1>
        <p>An instant reply has been queued, follow-ups are scheduled, and this lead is now visible in your demo lead queue. You can track this lead from there.</p>
        <div class="actions">
            <a href="/static/index.html">Open Lead Queue</a>
            <a class="secondary" href="/demo">Try another demo</a>
        </div>
    </main>
    <script src="/static/demo-auth.js"></script>
    <script>
        window.demoAuth.requireLogin();
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
