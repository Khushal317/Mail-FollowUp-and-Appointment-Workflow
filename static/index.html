<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Queue</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .page {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 18px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 22px;
        }
        h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
        .explain { color: #66758a; margin: 0; line-height: 1.55; max-width: 720px; }
        .nav a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            white-space: nowrap;
        }
        .nav {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(33, 45, 70, 0.06);
        }
        table {
            width: 100%;
            min-width: 980px;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid #e7edf5;
            vertical-align: middle;
            font-size: 14px;
        }
        th {
            color: #526071;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #fbfcfe;
        }
        tr:last-child td { border-bottom: 0; }
        .name { font-weight: 800; }
        .muted { color: #66758a; }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0 9px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 12px;
        }
        .high { background: #fff2d7; color: #8a4b00; }
        .priority { background: #e8f0ff; color: #174ebd; }
        .standard { background: #edf2f7; color: #475569; }
        .engaged { background: #e7f8ef; color: #087443; }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            border: 0;
            border-radius: 8px;
            min-height: 34px;
            padding: 0 11px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: #2563eb;
            font-size: 13px;
        }
        button.secondary { background: #087443; }
        button.done { background: #526071; }
        .loader {
            padding: 34px;
            text-align: center;
            color: #66758a;
        }
        @media (max-width: 760px) {
            header { display: block; }
            .nav { margin-top: 16px; }
            .nav { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <h1>Lead Queue</h1>
                <p class="explain">This is where your team sees the hottest leads first. When a customer replies or books an appointment, they move higher in the queue.</p>
            </div>
            <nav class="nav">
                <a href="/demo">Demo Forms</a>
                <a href="/static/index.html">Queue</a>
                <a href="/static/appointments.html">Appointments</a>
                <a href="/static/completed.html">Sales</a>
                <a href="#" onclick="logoutDemo()">Logout</a>
            </nav>
        </header>

        <section class="table-wrap" id="queue">
            <div class="loader">Loading leads...</div>
        </section>
    </main>

    <script src="/static/demo-auth.js"></script>
    <script>
        const businessLabels = {
            SOLAR: "Solar Company",
            HOME_SERVICES: "Home Services",
            OTHER_BUSINESS: "Other Business"
        };
        const login = window.demoAuth.requireLogin();
        const demoSessionId = login ? login.id : "";

        document.addEventListener("DOMContentLoaded", () => {
            fetchLeads();
            setInterval(fetchLeads, 10000);
        });

        async function fetchLeads() {
            try {
                const leadIds = getRememberedLeadIds();
                const response = await fetch(`/sales/leads?demo_session_id=${encodeURIComponent(demoSessionId)}&lead_ids=${encodeURIComponent(leadIds.join(","))}`);
                const leads = await response.json();
                renderLeads(leads);
            } catch (error) {
                document.getElementById("queue").innerHTML = '<div class="loader">Failed to load leads.</div>';
            }
        }

        function renderLeads(leads) {
            const queue = document.getElementById("queue");
            if (!leads.length) {
                queue.innerHTML = '<div class="loader">No active leads yet. Submit a demo form to start the automation.</div>';
                return;
            }

            queue.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Business Type</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Lead Score</th>
                            <th>Status</th>
                            <th>Appointment Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${leads.map(leadRow).join("")}
                    </tbody>
                </table>`;
        }

        function leadRow(lead) {
            const status = lead.tracking?.lead_status || lead.lead_status || "NURTURING";
            const category = lead.lead_category || "STANDARD";
            const categoryClass = category === "HIGH_VALUE" ? "high" : category === "PRIORITY" ? "priority" : "standard";
            const statusClass = status === "ENGAGED" || status === "APPOINTMENT_BOOKED" ? "engaged" : "standard";
            const scoreText = `${category} (${lead.lead_score || 0})`;

            return `
                <tr id="lead-${lead.id}">
                    <td><span class="name">${escapeHtml(lead.full_name)}</span></td>
                    <td>${businessLabels[lead.business_type] || "Other Business"}</td>
                    <td>${escapeHtml(lead.email)}</td>
                    <td>${escapeHtml(lead.phone_number)}</td>
                    <td><span class="badge ${categoryClass}">${scoreText}</span></td>
                    <td><span class="badge ${statusClass}">${status}</span></td>
                    <td>${lead.appointment_status || "NOT_SENT"}</td>
                    <td>${actions(lead)}</td>
                </tr>`;
        }

        function actions(lead) {
            if (!lead.assigned_to) {
                return `<div class="actions"><button onclick="claimLead(${lead.id})">Claim</button></div>`;
            }
            return `
                <div class="actions">
                    <span class="muted">Claimed by ${escapeHtml(lead.assigned_to)}</span>
                    <button class="secondary" onclick="sendBookingLink(${lead.id})">${bookingLabel(lead.business_type)}</button>
                    <button class="done" onclick="completeLead(${lead.id})">Complete</button>
                </div>`;
        }

        function bookingLabel(type) {
            if (type === "HOME_SERVICES") return "Book Service Appointment";
            if (type === "OTHER_BUSINESS") return "Book Consultation";
            return "Book Site Visit";
        }

        async function claimLead(leadId) {
            const salesPerson = prompt("Enter your name to claim this lead:");
            if (!salesPerson || !salesPerson.trim()) return;
            const salesMobile = prompt("Enter your mobile number:");
            if (!salesMobile || !salesMobile.trim()) return;

            const response = await fetch(`/sales/leads/${leadId}/claim`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sales_person: salesPerson.trim(),
                    sales_person_mobile: salesMobile.trim()
                })
            });

            if (!response.ok) {
                const data = await response.json();
                alert(data.detail || "Could not claim lead.");
                return;
            }
            fetchLeads();
        }

        async function sendBookingLink(leadId) {
            if (!confirm("Send the booking link to this customer?")) return;
            const response = await fetch(`/api/appointments/${leadId}/send-link`, { method: "POST" });
            const data = await response.json();
            alert(response.ok ? "Booking link queued for email." : data.detail || "Could not send booking link.");
            fetchLeads();
        }

        async function completeLead(leadId) {
            const salesMobile = prompt("Enter the mobile number used to claim this lead:");
            if (!salesMobile || !salesMobile.trim()) return;

            const response = await fetch(`/sales/leads/${leadId}/complete`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sales_person_mobile: salesMobile.trim() })
            });

            if (!response.ok) {
                const data = await response.json();
                alert(data.detail || "Could not complete lead.");
                return;
            }
            fetchLeads();
        }

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function getRememberedLeadIds() {
            try {
                return JSON.parse(localStorage.getItem(`demo_lead_ids_${demoSessionId}`) || "[]")
                    .filter(value => Number.isInteger(value));
            } catch (error) {
                return [];
            }
        }

        function logoutDemo() {
            window.demoAuth.logout();
            window.location.href = "/login";
        }
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
