<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .panel {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 14px 34px rgba(33, 45, 70, 0.07);
            text-align: center;
        }
        .mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e7f8ef;
            color: #087443;
            font-weight: 900;
        }
        h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
        .intro { color: #66758a; line-height: 1.55; margin: 0 0 22px; }
        .details {
            text-align: left;
            background: #f8fafc;
            border: 1px solid #e1e8f2;
            border-radius: 8px;
            padding: 16px;
        }
        .label {
            display: block;
            color: #66758a;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .value { display: block; font-weight: 800; margin-bottom: 14px; }
        .value:last-child { margin-bottom: 0; }
        .loader { color: #66758a; }
    </style>
</head>
<body>
    <main class="panel">
        <div id="loader" class="loader">Verifying booking details...</div>
        <section id="content" style="display: none;">
            <div class="mark">OK</div>
            <h1>Booking confirmed.</h1>
            <p class="intro">A confirmation email has been queued with the appointment details.</p>
            <div class="details">
                <span class="label">Date and time</span>
                <span class="value" id="dt-value"></span>
                <span class="label">Confirmed address</span>
                <span class="value" id="addr-value"></span>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = new URLSearchParams(window.location.search).get("token");
            if (!token) {
                document.getElementById("loader").textContent = "Invalid link.";
                return;
            }

            try {
                const res = await fetch(`/api/appointments/confirmation/${token}`);
                if (!res.ok) {
                    document.getElementById("loader").textContent = "Booking not found or not confirmed.";
                    return;
                }

                const data = await res.json();
                const dateObj = new Date(data.date_time);
                const dateStr = dateObj.toLocaleDateString(undefined, {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                });
                const timeStr = dateObj.toLocaleTimeString(undefined, {
                    hour: "numeric",
                    minute: "2-digit"
                });

                document.getElementById("dt-value").textContent = `${dateStr} at ${timeStr}`;
                document.getElementById("addr-value").textContent = data.address;
                document.getElementById("loader").style.display = "none";
                document.getElementById("content").style.display = "block";
            } catch (error) {
                document.getElementById("loader").textContent = "Network error loading details.";
            }
        });
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
