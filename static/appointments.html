<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booked Appointments</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .page {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 18px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 22px;
        }
        h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
        .explain { color: #66758a; margin: 0; line-height: 1.55; }
        .nav a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            margin-left: 16px;
            white-space: nowrap;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 10px 26px rgba(33, 45, 70, 0.06);
        }
        .card h2 { margin: 0 0 8px; font-size: 20px; }
        .badge {
            display: inline-flex;
            min-height: 26px;
            align-items: center;
            padding: 0 9px;
            border-radius: 999px;
            background: #e8f0ff;
            color: #174ebd;
            font-weight: 800;
            font-size: 12px;
            margin-bottom: 12px;
        }
        p { margin: 8px 0; color: #526071; line-height: 1.45; }
        strong { color: #172033; }
        button {
            margin-top: 14px;
            width: 100%;
            min-height: 40px;
            border: 0;
            border-radius: 8px;
            background: #087443;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }
        .empty {
            grid-column: 1 / -1;
            padding: 34px;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            text-align: center;
            color: #66758a;
        }
        @media (max-width: 760px) {
            header { display: block; }
            .nav { margin-top: 16px; }
            .nav a { margin: 0 14px 0 0; display: inline-block; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <h1>Booked Appointments</h1>
                <p class="explain">These customers used a booking link after the team claimed the lead.</p>
            </div>
            <nav class="nav">
                <a href="/static/index.html">Queue</a>
                <a href="/static/appointments.html">Appointments</a>
                <a href="/static/completed.html">Sales</a>
                <a href="#" onclick="logoutDemo()">Logout</a>
            </nav>
        </header>

        <section class="grid" id="appointments-grid">
            <div class="empty">Loading appointments...</div>
        </section>
    </main>

    <script src="/static/demo-auth.js"></script>
    <script>
        const businessLabels = {
            SOLAR: "Solar Company",
            HOME_SERVICES: "Home Services",
            OTHER_BUSINESS: "Other Business"
        };
        const login = window.demoAuth.requireLogin();
        const demoSessionId = login ? login.id : "";

        document.addEventListener("DOMContentLoaded", fetchAppointments);

        async function fetchAppointments() {
            try {
                const res = await fetch(`/api/appointments/booked?demo_session_id=${encodeURIComponent(demoSessionId)}`);
                const data = await res.json();
                renderAppointments(data);
            } catch (error) {
                document.getElementById("appointments-grid").innerHTML = '<div class="empty">Error loading appointments.</div>';
            }
        }

        function renderAppointments(appointments) {
            const grid = document.getElementById("appointments-grid");
            if (!appointments.length) {
                grid.innerHTML = '<div class="empty">No booked appointments yet.</div>';
                return;
            }

            grid.innerHTML = appointments.map(appt => {
                const dateObj = new Date(appt.appointment_time);
                const timeStr = dateObj.toLocaleString(undefined, {
                    weekday: "short",
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                });
                return `
                    <article class="card">
                        <span class="badge">${appt.lead_category}</span>
                        <h2>${escapeHtml(appt.customer_name)}</h2>
                        <p><strong>Business:</strong> ${businessLabels[appt.business_type] || "Other Business"}</p>
                        <p><strong>Time:</strong> ${timeStr}</p>
                        <p><strong>Address:</strong> ${escapeHtml(appt.confirmed_address)}</p>
                        <p><strong>Phone:</strong> ${escapeHtml(appt.phone_number)}</p>
                        <p><strong>Email:</strong> ${escapeHtml(appt.email)}</p>
                        <p><strong>Assigned Rep:</strong> ${escapeHtml(appt.assigned_rep)}</p>
                        <button onclick="markCompleted(${appt.id}, '${escapeForAttribute(appt.assigned_rep)}')">Mark Completed</button>
                    </article>`;
            }).join("");
        }

        async function markCompleted(appointmentId, assignedRep) {
            const salesMobile = prompt(`Enter the mobile number used to claim this lead, ${assignedRep}:`);
            if (!salesMobile || !salesMobile.trim()) return;

            const res = await fetch(`/api/appointments/${appointmentId}/complete`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sales_rep: assignedRep,
                    sales_rep_mobile: salesMobile.trim()
                })
            });

            if (!res.ok) {
                const data = await res.json();
                alert(data.detail || "Could not complete appointment.");
                return;
            }
            fetchAppointments();
        }

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function escapeForAttribute(value) {
            return String(value || "").replace(/'/g, "\\'");
        }

        function logoutDemo() {
            window.demoAuth.logout();
            window.location.href = "/login";
        }
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
