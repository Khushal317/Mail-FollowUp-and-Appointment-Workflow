<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Team</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        .page {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 18px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 22px;
        }
        h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
        .explain { color: #66758a; margin: 0; line-height: 1.55; max-width: 680px; }
        .nav a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            margin-left: 16px;
            white-space: nowrap;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .metric {
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 10px 26px rgba(33, 45, 70, 0.06);
        }
        .metric strong {
            display: block;
            font-size: 30px;
            margin-bottom: 4px;
        }
        .metric span {
            color: #66758a;
            font-weight: 700;
        }
        .panel {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(33, 45, 70, 0.06);
        }
        table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 15px 14px;
            border-bottom: 1px solid #e7edf5;
            font-size: 14px;
        }
        th {
            color: #526071;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #fbfcfe;
        }
        tr:last-child td { border-bottom: 0; }
        .person {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e8f0ff;
            color: #174ebd;
            font-weight: 900;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            background: #e7f8ef;
            color: #087443;
            font-weight: 900;
        }
        .empty {
            padding: 34px;
            text-align: center;
            color: #66758a;
        }
        @media (max-width: 760px) {
            header { display: block; }
            .nav { margin-top: 16px; }
            .nav a { margin: 0 14px 0 0; display: inline-block; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div>
                <h1>Sales Team</h1>
                <p class="explain">A sale is counted when a customer books an appointment from the booking link sent by a claimed sales person.</p>
            </div>
            <nav class="nav">
                <a href="/static/index.html">Queue</a>
                <a href="/static/appointments.html">Appointments</a>
                <a href="/static/completed.html">Sales</a>
                <a href="#" onclick="logoutDemo()">Logout</a>
            </nav>
        </header>

        <section class="summary" id="summary">
            <article class="metric"><strong>0</strong><span>Total completed sales</span></article>
            <article class="metric"><strong>0</strong><span>Sales people</span></article>
        </section>

        <section class="panel" id="sales-panel">
            <div class="empty">Loading sales performance...</div>
        </section>
    </main>

    <script src="/static/demo-auth.js"></script>
    <script>
        const login = window.demoAuth.requireLogin();
        const demoSessionId = login ? login.id : "";

        document.addEventListener("DOMContentLoaded", fetchStats);

        async function fetchStats() {
            try {
                const res = await fetch(`/api/appointments/stats?demo_session_id=${encodeURIComponent(demoSessionId)}`);
                const data = await res.json();
                renderSummary(data);
                renderSales(data);
            } catch (error) {
                document.getElementById("sales-panel").innerHTML = '<div class="empty">Error loading sales performance.</div>';
            }
        }

        function renderSummary(stats) {
            const total = stats.reduce((sum, item) => sum + Number(item.completed_sales || 0), 0);
            document.getElementById("summary").innerHTML = `
                <article class="metric"><strong>${total}</strong><span>Total completed sales</span></article>
                <article class="metric"><strong>${stats.length}</strong><span>Sales people</span></article>`;
        }

        function renderSales(stats) {
            const panel = document.getElementById("sales-panel");
            if (!stats.length) {
                panel.innerHTML = '<div class="empty">No booked appointments yet. Sales will appear here after customers book.</div>';
                return;
            }

            panel.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Sales Person</th>
                            <th>Mobile Number</th>
                            <th>Completed Sales</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${stats.map(row => `
                            <tr>
                                <td>
                                    <span class="person">
                                        <span class="avatar">${initials(row.sales_rep)}</span>
                                        ${escapeHtml(row.sales_rep)}
                                    </span>
                                </td>
                                <td>${escapeHtml(row.mobile || "-")}</td>
                                <td><span class="badge">${Number(row.completed_sales || 0)} sales</span></td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>`;
        }

        function initials(name) {
            return String(name || "U").trim().slice(0, 1).toUpperCase();
        }

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function logoutDemo() {
            window.demoAuth.logout();
            window.location.href = "/login";
        }
    </script>
    <script src="/static/contact-banner.js"></script>
</body>
</html>
